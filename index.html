<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Arch System PG</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🏗️ Arch System PG</h1>
      <nav id="levels"></nav>
    </header>

    <section class="brief">
      <div class="chapter" id="level-chapter"></div>
      <h2 id="level-title"></h2>
      <p id="level-brief"></p>
      <div class="chips" id="level-chips"></div>
    </section>

    <section class="board">
      <canvas id="board"></canvas>
      <div class="legend">
        <span><i class="line solid"></i> petición</span>
        <span><i class="line dashed"></i> respaldo si falla</span>
        <span><i class="line write"></i> escrituras</span>
        <span><i class="line async"></i> a la cola</span>
        <span class="hint">Toca dos bloques para conectarlos · arrastra para mover · toca ● para borrar una flecha</span>
      </div>
    </section>

    <section class="palette" id="palette"></section>

    <div class="actions">
      <button class="btn ghost" id="reset" title="Reiniciar nivel">↺</button>
      <button class="btn primary" id="run">▶ Simular tráfico</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal" id="modal"><div class="card" id="modal-card"></div></div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
